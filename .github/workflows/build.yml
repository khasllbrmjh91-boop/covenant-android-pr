name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify zip file exists
        run: |
          if [ ! -f covenant-android-project.zip ]; then
            echo "::error::covenant-android-project.zip not found in repository root"
            exit 1
          fi

      - name: Extract project zip
        run: |
          echo "Extracting covenant-android-project.zip..."
          unzip -q -o covenant-android-project.zip
          
          # تحديد المجلد الذي يحتوي على package.json
          PROJECT_ROOT=$(find . -maxdepth 2 -name "package.json" -not -path "./node_modules/*" -printf '%h\n' | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No package.json found after extraction"
            exit 1
          fi
          
          echo "Project root detected at: $PROJECT_ROOT"
          
          # إذا كان المشروع داخل مجلد فرعي غير covenant-android-project، انقله
          if [ "$PROJECT_ROOT" != "./covenant-android-project" ]; then
            # تجنب نقل الملفات من الجذر الحالي
            if [ "$PROJECT_ROOT" = "." ] || [ "$PROJECT_ROOT" = "./" ]; then
              echo "Project is already at repository root, moving contents to covenant-android-project/"
              mkdir -p covenant-android-project
              # انقل كل شيء ما عدا المجلد الذي ننشئه والملف المضغوط
              shopt -s extglob
              mv !(covenant-android-project|covenant-android-project.zip) covenant-android-project/ 2>/dev/null || true
              shopt -u extglob
            else
              echo "Moving $PROJECT_ROOT to ./covenant-android-project"
              mkdir -p covenant-android-project
              mv "$PROJECT_ROOT"/* covenant-android-project/ 2>/dev/null || true
              mv "$PROJECT_ROOT"/.[!.]* covenant-android-project/ 2>/dev/null || true
              rmdir "$PROJECT_ROOT" 2>/dev/null || true
            fi
          fi

      - name: Verify project structure
        working-directory: covenant-android-project
        run: |
          test -f package.json || { echo "::error::package.json missing"; exit 1; }
          echo "Basic project structure OK"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: covenant-android-project/package-lock.json

      - name: Install dependencies
        working-directory: covenant-android-project
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Sync Capacitor Android
        working-directory: covenant-android-project
        run: |
          if [ ! -d android ]; then
            echo "Android platform not found, adding it..."
            npx cap add android
          else
            echo "Android platform exists, syncing..."
          fi
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: covenant-android-project/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: covenant-android-project/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find covenant-android-project/android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found after build"
            exit 1
          fi
          echo "APK path: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          if [[ -n "${{ steps.apk.outputs.apk_path }}" && -f "${{ steps.apk.outputs.apk_path }}" ]]; then
            echo "✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK build failed" >> $GITHUB_STEP_SUMMARY
          fi
