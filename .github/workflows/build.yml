name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip project
        run: unzip -o covenant-android-project.zip

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and sync
        run: |
          cd covenant-android-project
          npm install
          npx cap sync android

      - name: Build APK
        run: |
          cd covenant-android-project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: covenant-android-project/app/build/outputs/apk/debug/app-debug.apk
