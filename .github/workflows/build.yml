      - name: Deduplicate Manifest Declarations
        run: |
          MANIFEST="extracted/android/app/src/main/AndroidManifest.xml"
          awk '!seen[$0]++ || $0 !~ /android.permission.INTERNET/ { print }' "$MANIFEST" > /tmp/manifest-dedup.xml
          mv /tmp/manifest-dedup.xml "$MANIFEST"
          awk '!seen[$0]++ || $0 !~ /android.intent.action.QUICKBOOT_POWERON/ { print }' "$MANIFEST" > /tmp/manifest-dedup.xml
          mv /tmp/manifest-dedup.xml "$MANIFEST"
          echo "✅ Duplicate INTERNET and QUICKBOOT declarations removed"

      - name: Build Debug APK
        id: build
        working-directory: ./extracted/android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-full.log
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
          exit ${PIPESTATUS[0]}

      - name: Show Build Errors
        if: steps.build.outcome == 'failure'
        working-directory: ./extracted/android
        run: |
          echo "════════════════════════════════════════"
          echo "🔴 Kotlin Errors:"
          echo "════════════════════════════════════════"
          grep -nE "^e: |Unresolved reference|error:" build-full.log | head -50 || echo "No Kotlin errors"
          echo ""
          echo "════════════════════════════════════════"
          echo "🔴 What went wrong:"
          echo "════════════════════════════════════════"
          grep -A 10 "What went wrong" build-full.log || echo "No 'What went wrong'"
          echo ""
          echo "════════════════════════════════════════"
          echo "🔴 آخر 80 سطر:"
          echo "════════════════════════════════════════"
          tail -80 build-full.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: extracted/android/build-full.log
          retention-days: 7

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: koufant-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
