name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # الأذونات اللازمة لرفع الـ artifacts
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List repository files
        run: |
          echo "=== Repository Root ==="
          ls -la
          if [ ! -f covenant-android-project.zip ]; then
            echo "ERROR: covenant-android-project.zip not found!"
            exit 1
          fi

      - name: Extract project zip
        run: |
          echo "Extracting covenant-android-project.zip..."
          unzip -o covenant-android-project.zip
          
          # اكتشاف المجلد الجذري الفعلي الذي يحتوي على package.json
          ROOT_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "./node_modules/*" -printf '%h\n' | head -1)
          echo "Detected project root: $ROOT_DIR"
          
          # إذا كان المجلد الجذري مختلفًا عن المطلوب، انقل المحتويات
          if [ "$ROOT_DIR" != "./covenant-android-project" ]; then
            echo "Moving $ROOT_DIR to ./covenant-android-project"
            mkdir -p covenant-android-project
            mv "$ROOT_DIR"/* covenant-android-project/ 2>/dev/null || true
            mv "$ROOT_DIR"/.[!.]* covenant-android-project/ 2>/dev/null || true
            rmdir "$ROOT_DIR" 2>/dev/null || true
          fi

      - name: Verify basic project structure
        run: |
          cd covenant-android-project
          ls -la
          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # التخزين المؤقت لـ Gradle يتم بعد فك الضغط، والمسار صحيح الآن
          cache: 'gradle'
          cache-dependency-path: covenant-android-project/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: covenant-android-project/package-lock.json

      - name: Install Node dependencies
        working-directory: covenant-android-project
        run: |
          echo "Installing npm packages..."
          npm install --legacy-peer-deps
          echo "✓ Dependencies installed"

      - name: Sync Capacitor Android platform
        working-directory: covenant-android-project
        run: |
          echo "Syncing Capacitor..."
          # إذا لم يكن مجلد android موجودًا، أنشئه أولاً
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "✓ Capacitor synced"

      - name: Verify Gradle wrapper
        working-directory: covenant-android-project/android
        run: |
          echo "=== Android directory ==="
          ls -la
          test -f gradlew || { echo "ERROR: gradlew not found"; exit 1; }
          chmod +x gradlew
          echo "✓ Gradle wrapper found and executable"

      - name: Build debug APK
        working-directory: covenant-android-project/android
        run: |
          echo "Building APK with Gradle..."
          ./gradlew clean assembleDebug --stacktrace
          echo "✓ Build completed"

      - name: Find generated APK path
        id: find_apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found after build"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish build summary
        if: always()
        run: |
          if [ -f "${{ steps.find_apk.outputs.apk_path }}" ]; then
            echo "✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK build failed" >> $GITHUB_STEP_SUMMARY
          fi
