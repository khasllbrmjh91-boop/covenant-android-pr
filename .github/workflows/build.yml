name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Debug - List files
        run: |
          echo "=== Repository Root ==="
          ls -la
          echo "=== Checking covenant-android-project.zip ==="
          if [ -f covenant-android-project.zip ]; then
            unzip -t covenant-android-project.zip | head -20
          else
            echo "ERROR: covenant-android-project.zip not found!"
            exit 1
          fi

      - name: Extract project
        run: |
          echo "Extracting covenant-android-project.zip..."
          unzip -o covenant-android-project.zip
          echo "=== Contents after extraction ==="
          ls -la
          
          # Handle nested directory structure
          if [ -d "covenant-android-project/covenant-android-project" ]; then
            echo "Detected nested structure, flattening..."
            mv covenant-android-project/covenant-android-project/* covenant-android-project/
            rmdir covenant-android-project/covenant-android-project
          fi

      - name: Verify project structure
        run: |
          cd covenant-android-project
          echo "=== Project directory structure ==="
          ls -la
          
          # Check for required files
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi
          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found"
            exit 1
          fi
          echo "✓ Basic structure verified"

      - name: Install Node dependencies
        run: |
          cd covenant-android-project
          echo "Installing npm packages..."
          npm install --legacy-peer-deps
          echo "✓ Dependencies installed"

      - name: Verify Gradle wrapper
        run: |
          cd covenant-android-project/android
          echo "=== Android directory ==="
          ls -la
          
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found in android/"
            echo "Looking for Gradle wrapper..."
            find . -name "gradlew" -type f
            exit 1
          fi
          chmod +x gradlew
          echo "✓ Gradle wrapper found and executable"

      - name: Sync Capacitor Android
        run: |
          cd covenant-android-project
          echo "Syncing Capacitor..."
          npx cap sync android
          echo "✓ Capacitor synced"

      - name: Build APK
        run: |
          cd covenant-android-project/android
          echo "Building APK with Gradle..."
          ./gradlew clean assembleDebug --stacktrace
          echo "✓ Build completed"

      - name: Verify APK output
        run: |
          cd covenant-android-project
          echo "=== Checking APK output locations ==="
          find . -name "app-debug.apk" -type f
          
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "WARNING: Expected APK not found"
            echo "=== Gradle build outputs ==="
            find . -name "*.apk" -type f
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: |
            covenant-android-project/app/build/outputs/apk/debug/app-debug.apk
            covenant-android-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
        if: always()

      - name: Publish build results
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "covenant-android-project/app/build/outputs/apk/debug/app-debug.apk" ] || [ -f "covenant-android-project/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK build failed" >> $GITHUB_STEP_SUMMARY
          fi
